      Phase A shell.

      src/00-head.html and src/05-body.html. For the Vite build we load them as

      `./legacy/head.html` and `./legacy/body.html` are generated from the
      existing fragments by tools/extract-legacy.mjs so there is exactly ONE
      source of truth during the migration — no copy that can drift.
